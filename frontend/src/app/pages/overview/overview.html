<div class="overview">
  <div class="header">
    <h1>Real-time Monitoring</h1>
    <p>{{ selectedSensorName }} - Data from the last 5 minutes</p>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <div class="header-left">
        <h2>Sensor Metrics</h2>
        <select class="sensor-select" [(ngModel)]="selectedSensorId" (change)="onSensorChange()">
          <option *ngFor="let sensor of sensors" [value]="sensor.id">
            {{ sensor.name }}
          </option>
        </select>
      </div>
      <div class="chart-info">
        <span class="status-dot"></span>
        <span>Updated every 5s</span>
      </div>
    </div>

    <div class="chart-container">
      <canvas
        baseChart
        [type]="lineChartType"
        [data]="lineChartData"
        [options]="lineChartOptions"
      >
      </canvas>
    </div>
  </div>
</div>
